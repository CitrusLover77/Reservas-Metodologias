<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servicios · Citrus Zone</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="app"><header class="top-nav"><a class="brand" href="panel.html"><span class="mark">CZ</span><div><strong>Citrus Zone</strong><span>Administración</span></div></a><div class="account-actions"><span class="who" data-who></span><button class="ghost-btn" data-logout>Salir</button></div></header><nav class="admin-tabs"><a href="panel.html">Panel</a><a class="active" href="servicios.html">Servicios</a><a href="horarios.html">Horarios</a><a href="bloqueos.html">Bloqueos</a></nav><section class="panel"><header class="panel-header"><div><h2>Servicios</h2><p class="panel-subtitle">Administrá el catálogo del salón.</p></div></header><div class="panel-body"><form id="form" class="field-row"><label>Nombre<input id="nombre" required></label><label>Duración (min)<input id="duracion" type="number" min="1" required></label><label>Precio<input id="precio" type="number" min="0" required></label><button class="primary-btn">Crear servicio</button></form><div id="error" class="form-error"></div><div id="success" class="form-success"></div><div id="list" class="loading-state">Cargando servicios…</div></div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/ui.js"></script><script>if(requireAuth(['admin','superadmin'])){paintAccountHeader();async function load(){try{const r=await Api.listServices(),a=r.data||[];list.innerHTML=a.length?`<table class="res-table"><thead><tr><th>Servicio</th><th>Duración</th><th>Precio</th><th>Estado</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.nombre}</td><td>${x.duracion_minutos} min</td><td>${formatPrice(x.precio)}</td><td>${x.activo?statusPillHtml('confirmada'):statusPillHtml('cancelada')}</td></tr>`).join('')}</tbody></table>`:'<p class="empty-state">No hay servicios.</p>'}catch(e){showError(error,e.message)}}form.onsubmit=async e=>{e.preventDefault();hideError(error);try{await Api.createService({nombre:nombre.value.trim(),duracion_minutos:+duracion.value,precio:+precio.value});showSuccess(success,'Servicio creado.');form.reset();load()}catch(e){showError(error,e.message)}};load()}</script></body></html>
