<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloqueos · Citrus Zone</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="app"><header class="top-nav"><a class="brand" href="panel.html"><span class="mark">CZ</span><div><strong>Citrus Zone</strong><span>Administración</span></div></a><div class="account-actions"><span class="who" data-who></span><button class="ghost-btn" data-logout>Salir</button></div></header><nav class="admin-tabs"><a href="panel.html">Panel</a><a href="servicios.html">Servicios</a><a href="horarios.html">Horarios</a><a class="active" href="bloqueos.html">Bloqueos</a></nav><section class="panel"><header class="panel-header"><h2>Bloqueos de agenda</h2></header><div class="panel-body"><form id="form" class="field-row"><label>Fecha<input id="fecha" type="date" required></label><label>Desde<input id="inicio" type="time" required></label><label>Hasta<input id="fin" type="time" required></label><label>Motivo<input id="motivo"></label><button class="primary-btn">Crear bloqueo</button></form><div id="error" class="form-error"></div><div id="list" class="loading-state">Cargando bloqueos…</div></div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/ui.js"></script><script>if(requireAuth(['admin','superadmin'])){paintAccountHeader();async function load(){try{const r=await Api.listBlocks(),a=r.data||[];list.innerHTML=a.length?`<table class="res-table"><thead><tr><th>Fecha</th><th>Horario</th><th>Motivo</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.fecha}</td><td>${x.hora_inicio}–${x.hora_fin}</td><td>${x.motivo||'—'}</td><td><button class="danger-btn" onclick="removeBlock(${x.id})">Eliminar</button></td></tr>`).join('')}</tbody></table>`:'<p class="empty-state">No hay bloqueos.</p>'}catch(e){showError(error,e.message)}}form.onsubmit=async e=>{e.preventDefault();try{await Api.createBlock({fecha:fecha.value,hora_inicio:inicio.value,hora_fin:fin.value,motivo:motivo.value.trim()||null});form.reset();load()}catch(e){showError(error,e.message)}};window.removeBlock=async id=>{if(!confirm('¿Eliminar este bloqueo?'))return;try{await Api.deleteBlock(id);load()}catch(e){showError(error,e.message)}};load()}</script></body></html>
