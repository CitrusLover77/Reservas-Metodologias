<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservar · Citrus Zone</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><main class="app"><header class="top-nav"><a class="brand" href="inicio.html"><span class="mark">CZ</span><div><strong>Citrus Zone</strong><span>Sistema de reservas</span></div></a><nav class="nav-links"><a href="inicio.html">Inicio</a><a class="active" href="reservar.html">Reservar</a><a href="mis-reservas.html">Mis reservas</a></nav><div class="account-actions"><span class="who" data-who></span><button class="ghost-btn" data-logout>Salir</button></div></header><div class="main-grid"><section class="panel"><header class="panel-header"><div><h2>Nueva reserva</h2><p class="panel-subtitle">Seleccioná un servicio, profesional, fecha y horario.</p></div></header><div class="panel-body"><form id="booking-form" class="form-grid"><div id="error" class="form-error" role="alert"></div><label>Servicio<select id="service" required><option value="">Cargando…</option></select></label><label>Profesional<select id="professional" required disabled><option value="">Primero elegí un servicio</option></select></label><label>Fecha<input id="date" type="date" required></label><div id="slots" class="slots"><p class="muted">Elegí servicio, profesional y fecha para consultar horarios.</p></div><input id="time" type="hidden" required><button class="primary-btn" id="submit" type="submit" disabled>Confirmar reserva</button></form></div></section><aside class="panel"><header class="panel-header"><h2>Resumen</h2></header><div class="panel-body"><div id="summary" class="summary"><p class="muted">Completá los datos de tu turno.</p></div></div></aside></div></main><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/ui.js"></script><script>if(requireAuth()){paintAccountHeader();date.min=new Date().toISOString().slice(0,10);let services=[];const renderSummary=()=>{const s=services.find(x=>x.id==service.value),p=professional.selectedOptions[0]?.textContent;summary.innerHTML=s?`<div class="summary-row"><span>Servicio</span><strong>${s.nombre}</strong></div><div class="summary-row"><span>Profesional</span><strong>${p||'—'}</strong></div><div class="summary-row"><span>Fecha y hora</span><strong>${date.value||'—'} ${time.value||''}</strong></div><div class="summary-row"><span>Precio</span><strong>${formatPrice(s.precio)}</strong></div>`:'<p class="muted">Completá los datos de tu turno.</p>'};Api.listServices({onlyActive:true}).then(r=>{services=r.data||[];service.innerHTML='<option value="">Elegí un servicio</option>'+services.map(s=>`<option value="${s.id}">${s.nombre} · ${s.duracion_minutos} min</option>`).join('')}).catch(e=>showError(error,e.message));service.onchange=async()=>{professional.disabled=true;professional.innerHTML='<option>Cargando…</option>';renderSummary();try{const r=await Api.listProfessionals({servicioId:service.value});professional.innerHTML='<option value="">Elegí un profesional</option>'+(r.data||[]).map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');professional.disabled=false}catch(e){showError(error,e.message)}};async function availability(){time.value='';submit.disabled=true;renderSummary();if(!service.value||!professional.value||!date.value)return;slots.innerHTML='<p class="loading-state">Consultando disponibilidad…</p>';try{const r=await Api.getAvailability({servicioId:service.value,profesionalId:professional.value,fecha:date.value});const data=r.data||r.slots||[];slots.innerHTML=data.length?data.map(x=>`<button type="button" class="slot ${x.disponible===false?'blocked':''}" data-time="${x.hora||x}">${x.hora||x}</button>`).join(''):'<p class="empty-state">No hay horarios disponibles.</p>';slots.querySelectorAll('.slot:not(.blocked)').forEach(b=>b.onclick=()=>{slots.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');time.value=b.dataset.time;submit.disabled=false;renderSummary()})}catch(e){slots.innerHTML=`<p class="form-error visible">${e.message}</p>`}}professional.onchange=availability;date.onchange=availability;bookingForm=document.getElementById('booking-form');bookingForm.onsubmit=async e=>{e.preventDefault();try{const r=await Api.createBooking({servicio_id:+service.value,profesional_id:+professional.value,inicio:`${date.value}T${time.value}:00`});sessionStorage.setItem('cz_last_booking',JSON.stringify(r.data));location.href='confirmacion.html'}catch(e){showError(error,e.message)}}}</script></body></html>
