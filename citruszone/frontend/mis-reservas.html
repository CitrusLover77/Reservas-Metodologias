<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis reservas · Citrus Zone</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><main class="app"><header class="top-nav"><a class="brand" href="inicio.html"><span class="mark">CZ</span><div><strong>Citrus Zone</strong><span>Sistema de reservas</span></div></a><nav class="nav-links"><a href="inicio.html">Inicio</a><a href="reservar.html">Reservar</a><a class="active" href="mis-reservas.html">Mis reservas</a></nav><div class="account-actions"><span class="who" data-who></span><button class="ghost-btn" data-logout>Salir</button></div></header><section class="panel"><header class="panel-header"><div><h2>Mis reservas</h2><p class="panel-subtitle">Consultá y cancelá tus turnos.</p></div><a class="primary-btn" href="reservar.html">Nueva reserva</a></header><div class="panel-body"><div id="error" class="form-error"></div><div id="list" class="loading-state">Cargando reservas…</div></div></section></main><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/ui.js"></script><script>if(requireAuth()){paintAccountHeader();async function load(){try{const r=await Api.listMyBookings(),a=r.data||[];list.innerHTML=a.length?`<table class="res-table"><thead><tr><th>Inicio</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${a.map(x=>`<tr><td>${formatDateTime(x.inicio)}</td><td>${statusPillHtml(x.estado)}</td><td>${x.estado!=='cancelada'?`<button class="danger-btn" onclick="cancelBooking(${x.id})">Cancelar</button>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<p class="empty-state">Todavía no tenés reservas.</p>'}catch(e){showError(error,e.message)}}window.cancelBooking=async id=>{if(!confirm('¿Cancelar esta reserva?'))return;try{await Api.cancelBooking(id);load()}catch(e){showError(error,e.message)}};load()}</script></body></html>
