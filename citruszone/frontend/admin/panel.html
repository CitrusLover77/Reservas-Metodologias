<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel admin · Citrus Zone</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="app"><header class="top-nav"><a class="brand" href="panel.html"><span class="mark">CZ</span><div><strong>Citrus Zone</strong><span>Administración</span></div></a><div class="account-actions"><span class="who" data-who></span><button class="ghost-btn" data-logout>Salir</button></div></header><nav class="admin-tabs"><a class="active" href="panel.html">Panel</a><a href="servicios.html">Servicios</a><a href="horarios.html">Horarios</a><a href="bloqueos.html">Bloqueos</a></nav><section class="intro" style="padding:24px;margin-bottom:18px"><span class="eyebrow">Administración</span><h1 style="font-size:30px">Resumen de reservas</h1></section><div id="error" class="form-error"></div><div id="stats" class="admin-grid"><p class="loading-state">Cargando datos…</p></div><section class="panel" style="margin-top:18px"><header class="panel-header"><h2>Reservas recientes</h2></header><div class="panel-body" id="bookings"></div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/ui.js"></script><script>if(requireAuth(['admin','superadmin'])){paintAccountHeader();Promise.all([Api.listAllBookings(),Api.listServices()]).then(([b,s])=>{const a=b.data||[];stats.innerHTML=`<article class="admin-card"><strong>${a.length}</strong><span>Reservas registradas</span></article><article class="admin-card"><strong>${(s.data||[]).filter(x=>x.activo).length}</strong><span>Servicios activos</span></article><article class="admin-card"><strong>${a.filter(x=>x.estado==='confirmada').length}</strong><span>Reservas confirmadas</span></article>`;bookings.innerHTML=a.length?`<table class="res-table"><thead><tr><th>ID</th><th>Inicio</th><th>Estado</th></tr></thead><tbody>${a.slice(0,10).map(x=>`<tr><td>#${x.id}</td><td>${formatDateTime(x.inicio)}</td><td>${statusPillHtml(x.estado)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty-state">No hay reservas.</p>'}).catch(e=>showError(error,e.message));}</script></body></html>
