<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horarios · Citrus Zone</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><main class="app"><header class="top-nav"><a class="brand" href="panel.html"><span class="mark">CZ</span><div><strong>Citrus Zone</strong><span>Administración</span></div></a><div class="account-actions"><span class="who" data-who></span><button class="ghost-btn" data-logout>Salir</button></div></header><nav class="admin-tabs"><a href="panel.html">Panel</a><a href="servicios.html">Servicios</a><a class="active" href="horarios.html">Horarios</a><a href="bloqueos.html">Bloqueos</a></nav><section class="panel"><header class="panel-header"><h2>Horarios laborales</h2></header><div class="panel-body"><form id="form" class="field-row"><label>Profesional<select id="profesional" required></select></label><label>Día (0 domingo)<input id="dia" type="number" min="0" max="6" required></label><label>Desde<input id="inicio" type="time" required></label><label>Hasta<input id="fin" type="time" required></label><button class="primary-btn">Agregar horario</button></form><div id="error" class="form-error"></div><div id="list" class="loading-state">Cargando horarios…</div></div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/ui.js"></script><script>if(requireAuth(['admin','superadmin'])){paintAccountHeader();async function load(){try{const [h,p]=await Promise.all([Api.listSchedules(),Api.listProfessionals()]);profesional.innerHTML=(p.data||[]).map(x=>`<option value="${x.id}">${x.nombre}</option>`).join('');const a=h.data||[];list.innerHTML=a.length?`<table class="res-table"><thead><tr><th>Profesional</th><th>Día</th><th>Desde</th><th>Hasta</th></tr></thead><tbody>${a.map(x=>`<tr><td>#${x.profesional_id}</td><td>${x.dia_semana}</td><td>${x.hora_inicio}</td><td>${x.hora_fin}</td></tr>`).join('')}</tbody></table>`:'<p class="empty-state">No hay horarios cargados.</p>'}catch(e){showError(error,e.message)}}form.onsubmit=async e=>{e.preventDefault();try{await Api.createSchedule({profesional_id:+profesional.value,dia_semana:+dia.value,hora_inicio:inicio.value,hora_fin:fin.value});form.reset();load()}catch(e){showError(error,e.message)}};load()}</script></body></html>
